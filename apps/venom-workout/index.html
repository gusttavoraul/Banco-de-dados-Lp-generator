<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0b0d0a">
  <meta name="description" content="Venom Workout — agende aulas de Cross na Skyfit Mogi das Cruzes, registre seus PRs e compartilhe seus treinos.">
  <title>Venom Workout</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/logo.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/logo.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <!-- 1. Splash animado -->
  <div id="splash" aria-hidden="true">
    <div class="splash-ring"></div>
    <img src="icons/logo.svg" alt="" class="splash-logo">
    <div class="splash-title"><span>VENOM</span> <span>WORKOUT</span></div>
    <div class="splash-sub">Skyfit · Mogi das Cruzes</div>
  </div>

  <!-- 2. Login / Cadastro -->
  <section id="auth" hidden></section>

  <!-- 3. App -->
  <div id="app" hidden>
    <header class="topbar">
      <img src="icons/logo.svg" alt="Venom Workout" class="topbar-logo">
      <h1 id="page-title">Início</h1>
      <button class="icon-btn" id="btn-notif" aria-label="Avisos">🔔<span class="dot" id="notif-dot" hidden></span></button>
    </header>
    <main id="view"></main>
    <nav class="tabbar" aria-label="Navegação principal">
      <a href="#/home" data-tab="home"><span>🏠</span>Início</a>
      <a href="#/agenda" data-tab="agenda"><span>📅</span>Agenda</a>
      <a href="#/prs" data-tab="prs"><span>🏆</span>PRs</a>
      <a href="#/feed" data-tab="feed"><span>📸</span>Treinos</a>
      <a href="#/perfil" data-tab="perfil"><span>👤</span>Perfil</a>
    </nav>
  </div>

  <div id="modal" hidden><div class="sheet" role="dialog" aria-modal="true"></div></div>
  <div id="toast" role="status" aria-live="polite"></div>

  <script src="data.js"></script>
  <script src="app.js"></script>
</body>
</html>
