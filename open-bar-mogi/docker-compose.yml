# Sobe um PostgreSQL local para desenvolvimento: docker compose up -d
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: openbar
      POSTGRES_PASSWORD: openbar
      POSTGRES_DB: openbar_mogi
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
